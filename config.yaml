# anvilkit-agent-control configuration (reviewed, secret-free). Loaded by
# internal/config with precedence defaults < this file < allowed environment
# overrides (ANVILKIT_CONTROL_LISTEN, ANVILKIT_CONTROL_HEALTH_LISTEN,
# ANVILKIT_CONTROL_IDENTITY_{CERT,KEY,CA}_FILE, ANVILKIT_CONTROL_IDENTITY_TRUST_DOMAIN,
# ANVILKIT_CONTROL_DATABASE_URL[_FILE],
# ANVILKIT_CONTROL_INVENTORY_DIR, ANVILKIT_CONTROL_INVENTORY_S3_ENDPOINT,
# ANVILKIT_CONTROL_INVENTORY_S3_BUCKET, ANVILKIT_CONTROL_INVENTORY_S3_ACCESS_KEY_ID[_FILE],
# ANVILKIT_CONTROL_INVENTORY_S3_SECRET_ACCESS_KEY[_FILE], ANVILKIT_CONTROL_TEMPORAL_ADDRESS,
# ANVILKIT_CONTROL_MODEL_PROXY_ADDRESS, ANVILKIT_CONTROL_MODEL_PROXY_TOKEN (secret)).
# Unknown keys fail startup. database.url and the inventory and artifact S3
# credentials are secrets: they are refused here and come only from the
# environment (ANVILKIT_CONTROL_ARTIFACTS_S3_{ENDPOINT,BUCKET,ACCESS_KEY_ID,SECRET_ACCESS_KEY})
# or, one or the other, from the mounted secret file the matching *_FILE
# variable (or *_file key) names, read once at load (P0.6, the OpenBao CSI
# volume). Outside development the DSN must name sslmode=verify-full and a
# selected S3 endpoint must be https (P0.6); this file's development guard
# admits the foundation's plaintext DSN and http MinIO.
# development: the top-level DEVELOPMENT_ONLY guard (P0.1). This checked-in
# file configures host-side runs on the development foundation
# (deploy/dev), whose Temporal frontend and OTLP collector are plaintext;
# every plaintext connection below names its own development mode as well.
# The guard downgrades nothing by itself: the gRPC listener stays mTLS. The
# chart renders its own file with the guard off.
development:
  enabled: true
grpc:
  listen: 127.0.0.1:9101
  control_capacity: 32
  execution_capacity: 64
  shutdown_timeout: 20s
  # identity: the listener's workload identity (P0.1). mtls serves TLS 1.3
  # with required, verified client certificates and authorizes every RPC by
  # the peer's SPIFFE URI SAN under trust_domain; the files are placements
  # (ANVILKIT_CONTROL_IDENTITY_{CERT,KEY,CA}_FILE, .local/dev/certs on the
  # foundation) watched and reloaded as a whole. development is plaintext
  # and authorizes nothing (requires development.enabled).
  identity:
    mode: mtls
    trust_domain: anvilkit.local
    max_connection_age: 1h
    reload_interval: 5s
# health: the plaintext HTTP probe listener (/healthz, /readyz); never a
# business endpoint (ANVILKIT_CONTROL_HEALTH_LISTEN).
health:
  listen: 127.0.0.1:9113
# database: the app-role pool; max_conns is the exact per-replica bound the
# deployment lock budgets (the URL is a secret from the environment or the
# mounted file database.url_file names).
database:
  max_conns: 8
# inventory: the external-obligation inventory (DD-02 §5). backend is
# filesystem (DEVELOPMENT_ONLY; inventory.dir comes from
# ANVILKIT_CONTROL_INVENTORY_DIR) or s3 (an S3-compatible backend through the
# AWS SDK; endpoint, bucket and credentials come from the environment, and
# qualify_on_start runs the conditional-create/listing probe before serving).
# Neither setting establishes the independent failure domain of ENV-02.
inventory:
  backend: filesystem
  s3:
    region: default
    prefix: control
    path_style: true
    qualify_on_start: true
# artifacts: the scoped artifact store of the eight artifact classes (DD-02
# §6, P08): a versioned S3-compatible bucket through the AWS SDK with its own
# credentials (the development foundation's MinIO, deploy/dev), a separate
# permission boundary from the inventory. backend disabled answers
# DEPENDENCY_UNAVAILABLE on every ArtifactService call.
artifacts:
  backend: s3
  max_object_bytes: 67108864
  max_window: 24h
  capability_ttl: 15m
  s3:
    region: default
    prefix: artifacts
    path_style: true
    qualify_on_start: true
temporal:
  address: 127.0.0.1:27233
  namespace: anvilkit
  task_queue: anvilkit-workflow
  # tls: the frontend transport; development is the foundation's plaintext
  # Temporal (DEVELOPMENT_ONLY, needs development.enabled), tls verifies the
  # frontend against ca_file/server_name, mtls also presents cert_file and
  # key_file (server-side TLS is P0.6).
  tls:
    mode: development
relay:
  interval: 500ms
profiles:
  local_check_deadline: 15m
  # generation: the validator profile of a generation's certification (P0.8):
  # the bound source is candidate code, validator-source-v1 under gVisor by
  # default; DEVELOPMENT_ONLY here the same chain on the foundation's
  # containerd runtime (state development).
  generation:
    validator_profile: validator-source-dev-v1
  # preview_build (P20): the deadline of one conditional save plus the
  # isolated build of the saved revision (the Workflow names the build's
  # reviewed job profile).
  preview_build:
    deadline: 30m
  # release (P21): the deadline of one release: certification of the
  # exact source, the maintainer's approval wait, both publications and the
  # activation. The approval wait never extends it.
  release:
    deadline: 720h
    # Each attempt (the certification Job, each guarded mutation) is bounded
    # below the operation deadline; the artifact store refuses transfer
    # windows beyond artifacts.max_window.
    attempt_window: 1h
# recovery: bounds of the rollback-window reconciliation (P07).
recovery:
  enumeration_page: 500
# model_proxy: the Model Proxy placement of the original-identity query of
# model dispatches (P11; ANVILKIT_CONTROL_MODEL_PROXY_ADDRESS). With an
# address, recovery asks the Proxy about an unresolved model dispatch of its
# owner; without one the DEVELOPMENT_ONLY attestation double of
# dispatch.development answers. The identity Control presents: development
# is a DEVELOPMENT_ONLY bearer token supplied only through
# ANVILKIT_CONTROL_MODEL_PROXY_TOKEN; mtls names the workload certificate
# files (ENV-03).
model_proxy:
  timeout: 15s
  owner: anvilkit-agent-model-proxy
  identity:
    mode: development
dispatch:
  authority_freshness: 30s
  # development: DEVELOPMENT_ONLY prices, route authorizations and trusted
  # not-sent issuers for the admission chain (delivery.md P06). With
  # enabled: false every paid route is denied; real prices/caps (ENV-06) and
  # authorization (ENV-07) are deployment inputs, never this file.
  development:
    enabled: false
