{{- include "anvilkit-agent-control.require" . -}}
{{- if eq .Values.secrets.provider "csi" }}
# P0.6: the service's credentials from OpenBao (no Kubernetes Secret).
{{ include "anvilkit-agent-control.secretProviderClass" (dict "root" . "name" (include "anvilkit-agent-control.fullname" .) "role" (default (include "anvilkit-agent-control.serviceAccountName" .) .Values.secrets.csi.role) "path" (required "secrets.csi.path is required under secrets.provider csi" .Values.secrets.csi.path) "keys" (include "anvilkit-agent-control.csiKeys" . | fromJsonArray)) }}
{{- end }}
