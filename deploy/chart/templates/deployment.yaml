{{- include "anvilkit-agent-control.require" . -}}
{{- $cfg := include "anvilkit-agent-control.config" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilkit-agent-control.fullname" . }}
  labels:
    {{- include "anvilkit-agent-control.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilkit-agent-control.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-control.selectorLabels" . | nindent 8 }}
        # The runtime Pods' component label: the PodDisruptionBudget selects
        # on it, so the migration Job's Pods (component "migration", which
        # carry the same selector labels) are never counted or protected.
        # Not part of the Deployment's immutable selector.
        app.kubernetes.io/component: control
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A changed configuration file rolls the Pods.
        checksum/config: {{ $cfg | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anvilkit-agent-control.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # No injected service-link variables: the configuration loader rejects
      # any ANVILKIT_CONTROL_* variable outside its allowlist.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control
          image: {{ include "anvilkit-agent-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The allowlisted environment overrides of internal/config: the file
          # path, the placement values and the secrets from their Secrets.
          env:
            - name: ANVILKIT_CONTROL_CONFIG
              value: /etc/anvilkit/anvilkit-agent-control/config.yaml
            - name: ANVILKIT_CONTROL_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.listen.port) | quote }}
            - name: ANVILKIT_CONTROL_HEALTH_LISTEN
              value: {{ printf "0.0.0.0:%d" (int .Values.health.port) | quote }}
            - name: ANVILKIT_CONTROL_TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            {{- if .Values.trust.configMap }}
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/anvilkit/trust
            {{- end }}
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: ANVILKIT_CONTROL_TELEMETRY_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.telemetry.metricsPort }}
            - name: ANVILKIT_CONTROL_TELEMETRY_METRICS_LISTEN
              value: {{ printf "0.0.0.0:%d" (int .Values.telemetry.metricsPort) | quote }}
            {{- end }}
            {{- $csi := eq .Values.secrets.provider "csi" }}
            {{- if $csi }}
            - name: ANVILKIT_CONTROL_DATABASE_URL_FILE
              value: /var/run/secrets/anvilkit/csi/database-url
            {{- else }}
            - name: ANVILKIT_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: {{ .Values.database.secret.key }}
            {{- end }}
            - name: ANVILKIT_CONTROL_INVENTORY_S3_ENDPOINT
              value: {{ .Values.inventory.s3.endpoint | quote }}
            - name: ANVILKIT_CONTROL_INVENTORY_S3_BUCKET
              value: {{ .Values.inventory.s3.bucket | quote }}
            {{- if $csi }}
            - name: ANVILKIT_CONTROL_INVENTORY_S3_ACCESS_KEY_ID_FILE
              value: /var/run/secrets/anvilkit/csi/inventory-access-key-id
            - name: ANVILKIT_CONTROL_INVENTORY_S3_SECRET_ACCESS_KEY_FILE
              value: /var/run/secrets/anvilkit/csi/inventory-secret-access-key
            {{- else }}
            - name: ANVILKIT_CONTROL_INVENTORY_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inventory.s3.secret.name }}
                  key: {{ .Values.inventory.s3.secret.accessKeyIdKey }}
            - name: ANVILKIT_CONTROL_INVENTORY_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inventory.s3.secret.name }}
                  key: {{ .Values.inventory.s3.secret.secretAccessKeyKey }}
            {{- end }}
            {{- if .Values.artifacts.enabled }}
            - name: ANVILKIT_CONTROL_ARTIFACTS_S3_ENDPOINT
              value: {{ .Values.artifacts.s3.endpoint | quote }}
            - name: ANVILKIT_CONTROL_ARTIFACTS_S3_BUCKET
              value: {{ .Values.artifacts.s3.bucket | quote }}
            {{- if $csi }}
            - name: ANVILKIT_CONTROL_ARTIFACTS_S3_ACCESS_KEY_ID_FILE
              value: /var/run/secrets/anvilkit/csi/artifacts-access-key-id
            - name: ANVILKIT_CONTROL_ARTIFACTS_S3_SECRET_ACCESS_KEY_FILE
              value: /var/run/secrets/anvilkit/csi/artifacts-secret-access-key
            {{- else }}
            - name: ANVILKIT_CONTROL_ARTIFACTS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.artifacts.s3.secret.name }}
                  key: {{ .Values.artifacts.s3.secret.accessKeyIdKey }}
            - name: ANVILKIT_CONTROL_ARTIFACTS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.artifacts.s3.secret.name }}
                  key: {{ .Values.artifacts.s3.secret.secretAccessKeyKey }}
            {{- end }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            {{- if .Values.telemetry.metricsPort }}
            - name: metrics
              containerPort: {{ .Values.telemetry.metricsPort }}
              protocol: TCP
            {{- end }}
          # The probes target the plaintext health listener: the kubelet
          # presents no client certificate and the mTLS business listener
          # refuses a handshake without one.
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- if .Values.shutdownDelaySeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.shutdownDelaySeconds }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvilkit/anvilkit-agent-control
              readOnly: true
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
            {{- if ne .Values.temporal.tls.mode "development" }}
            - name: temporal-ca
              mountPath: /etc/anvilkit/temporal-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.otlpEndpoint (ne .Values.telemetry.otlpTls.mode "development") }}
            - name: otlp-ca
              mountPath: /etc/anvilkit/otlp-ca
              readOnly: true
            {{- end }}
            {{- if eq .Values.secrets.provider "csi" }}
            - name: credentials
              mountPath: /var/run/secrets/anvilkit/csi
              readOnly: true
            {{- end }}
            {{- if .Values.trust.configMap }}
            - name: trust
              mountPath: /etc/anvilkit/trust
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvilkit-agent-control.fullname" . }}
        {{- if eq .Values.identity.mode "mtls" }}
        - name: identity
          secret:
            secretName: {{ include "anvilkit-agent-control.identitySecret" . }}
            defaultMode: 0440
        {{- end }}
        {{- if ne .Values.temporal.tls.mode "development" }}
        - name: temporal-ca
          secret:
            secretName: {{ .Values.temporal.tls.caSecret.name }}
            items:
              - key: {{ .Values.temporal.tls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.telemetry.otlpEndpoint (ne .Values.telemetry.otlpTls.mode "development") }}
        - name: otlp-ca
          secret:
            secretName: {{ .Values.telemetry.otlpTls.caSecret.name }}
            items:
              - key: {{ .Values.telemetry.otlpTls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.trust.configMap }}
        - name: trust
          configMap:
            name: {{ .Values.trust.configMap }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if eq .Values.secrets.provider "csi" }}
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "anvilkit-agent-control.fullname" . }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
