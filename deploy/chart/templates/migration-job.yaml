{{- include "anvilkit-agent-control.require" . -}}
{{- if .Values.migration.enabled }}
# The migration Job: the same image's anvilkit-migration applies the
# service-owned migrations (internal/migrate/sql) with the migrator role
# before the release's Pods roll. A failed Job stays for inspection until the
# next hook run replaces it; the service itself never runs DDL.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "anvilkit-agent-control.fullname" . }}-migration
  labels:
    {{- include "anvilkit-agent-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migration
          image: {{ include "anvilkit-agent-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/anvilkit-migration"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_MIGRATION_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secret.name }}
                  key: {{ .Values.migration.secret.key }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
