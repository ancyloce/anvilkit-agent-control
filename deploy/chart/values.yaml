# Chart values of anvilkit-agent-control. Only what this service needs: its
# image, its reviewed configuration file, the allowlisted placement overrides,
# the Secrets it reads its credentials from, probes, resources and the
# migration Job. Environment values (addresses, buckets, replica counts,
# Secret names, the pinned image digest) are supplied by the deploying
# repository per environment; secrets never enter this chart.

image:
  repository: anvilkit-agent-control
  # tag defaults to the chart's appVersion; digest, when set, pins the exact
  # image (repository@sha256:...) and takes precedence over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

# HorizontalPodAutoscaler (autoscaling/v2). Off unless the environment enables
# it with an explicit maxReplicas: the maximum is bounded by downstream caps
# and the database connection budget (deploy/gitops/lock.yaml), never a chart
# default. While enabled the Deployment leaves replicas to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 0
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  # Control needs no Kubernetes API access.
  automountServiceAccountToken: false

# The gRPC listener inside the Pod (ANVILKIT_CONTROL_LISTEN); the Service
# targets its port. Under identity.mode mtls it is mTLS-only: the kubelet's
# probes never target it (see health).
listen:
  address: 0.0.0.0
  port: 9101

# The plaintext HTTP probe listener inside the Pod
# (ANVILKIT_CONTROL_HEALTH_LISTEN): /healthz and /readyz only, bound on the
# Pod IP for the kubelet; no business endpoint, not exposed by the Service.
health:
  port: 9113

# The listener's workload identity (P0.1). mtls (the default) serves TLS 1.3
# with required client certificates verified against the mounted CA bundle
# and authorizes every RPC by the peer's SPIFFE URI SAN
# (spiffe://<trustDomain>/ns/<namespace>/sa/<service-account>) under the
# reviewed allowlist. The certificate is a cert-manager Certificate this
# chart renders (certificate.create) from issuerRef, or an existing Secret
# (secretName, keys tls.crt, tls.key, ca.crt) when create is false; the
# files are mounted at /etc/anvilkit/identity and reloaded as a whole.
# development is the plaintext listener of the development foundation and
# renders only with development.enabled: true.
identity:
  mode: mtls
  trustDomain: ""
  secretName: ""
  certificate:
    create: true
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 720h
  maxConnectionAge: 1h

# The top-level DEVELOPMENT_ONLY guard: every development transport below
# (identity.mode, temporal.tls.mode, telemetry.otlpTls.mode) renders only
# while this is true; it downgrades nothing by itself.
development:
  enabled: false

# Credential delivery (P0.6). kubernetes reads the existing Secrets named
# below (database.secret, the S3 secrets, migration.secret): the development
# foundation's path. csi mounts the credentials from OpenBao through the
# Secrets Store CSI driver (provider openbao, Kubernetes auth with the Pod's
# ServiceAccount token of audience csi.audience; the driver syncs no
# Kubernetes Secret) read-only at /var/run/secrets/anvilkit/csi, and the
# process reads each through its *_FILE variable. The service's KV v2 path
# holds the keys database-url, inventory-access-key-id,
# inventory-secret-access-key, artifacts-access-key-id and
# artifacts-secret-access-key under the role csi.role; the migration Job has
# its own ServiceAccount, role (csi.migrationRole) and path
# (csi.migrationPath, key migration-dsn), so neither reads the other's
# credential.
secrets:
  provider: kubernetes
  csi:
    address: ""
    caCertPath: ""
    audience: openbao
    role: ""
    path: ""
    migrationRole: ""
    migrationPath: ""

# P0.6: the data plane's CA bundle: a ConfigMap (key ca.crt) in this
# namespace, e.g. the anvilkit-trust map deploy/qualification/bootstrap.py
# maintains. Mounted at /etc/anvilkit/trust in the service and the migration
# Job (the DSNs' sslrootcert names /etc/anvilkit/trust/ca.crt) and added to
# the process roots (SSL_CERT_DIR) for the object stores' HTTPS. Empty: the
# image's roots only.
trust:
  configMap: ""

# The application-role connection (ANVILKIT_CONTROL_DATABASE_URL): a secret,
# read from an existing Secret that this chart never creates. Required under
# secrets.provider kubernetes.
database:
  secret:
    name: ""
    key: url

# The Temporal frontend (ANVILKIT_CONTROL_TEMPORAL_ADDRESS). Required. tls
# is the transport: tls verifies the frontend against the CA bundle of
# caSecret (key ca.crt) and serverName; mtls additionally presents the
# workload certificate of identity; development is the plaintext frontend
# of the development foundation (development.enabled only).
temporal:
  address: ""
  tls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt

# The obligation inventory (DD-02 §5): in a cluster every replica must share
# one backend, so the chart renders the S3 backend only (the filesystem
# adapter is DEVELOPMENT_ONLY and per process). Endpoint and bucket are
# placements (ANVILKIT_CONTROL_INVENTORY_S3_{ENDPOINT,BUCKET}); the
# credentials come from an existing Secret (ANVILKIT_CONTROL_INVENTORY_S3_
# {ACCESS_KEY_ID,SECRET_ACCESS_KEY}). Required.
inventory:
  s3:
    endpoint: ""
    bucket: ""
    secret:
      name: ""
      accessKeyIdKey: accessKeyId
      secretAccessKeyKey: secretAccessKey

# The scoped artifact store (DD-02 §6): its own bucket and its own
# credentials, a permission boundary separate from the inventory; the
# configuration loader refuses a shared bucket or access key. With
# enabled: false ArtifactService answers DEPENDENCY_UNAVAILABLE.
artifacts:
  enabled: true
  s3:
    endpoint: ""
    bucket: ""
    secret:
      name: ""
      accessKeyIdKey: accessKeyId
      secretAccessKeyKey: secretAccessKey

# The migration Job (the "migration" Job kind): cmd/anvilkit-migration of the
# same image, run with the migrator role before the release's Pods roll
# (Helm pre-install/pre-upgrade hook). The migrator DSN is a secret read
# from an existing Secret. The service never runs DDL.
migration:
  enabled: true
  secret:
    name: ""
    key: url
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

# The reviewed, secret-free configuration file (config.yaml sections):
# rendered into a ConfigMap and mounted at ANVILKIT_CONTROL_CONFIG. The
# placement values above override it through the allowlisted environment;
# the backends are fixed to s3 here (see inventory/artifacts).
config:
  grpc:
    listen: 127.0.0.1:9101
    control_capacity: 32
    execution_capacity: 64
    shutdown_timeout: 20s
    identity:
      reload_interval: 5s
  database:
    max_conns: 8
  inventory:
    backend: s3
    s3:
      region: default
      prefix: control
      path_style: true
      qualify_on_start: true
  artifacts:
    backend: s3
    max_object_bytes: 67108864
    max_window: 24h
    capability_ttl: 15m
    s3:
      region: default
      prefix: artifacts
      path_style: true
      qualify_on_start: true
  temporal:
    address: 127.0.0.1:27233
    namespace: anvilkit
    task_queue: anvilkit-workflow
  relay:
    interval: 500ms
  profiles:
    local_check_deadline: 15m
  recovery:
    enumeration_page: 500
  dispatch:
    authority_freshness: 30s
    development:
      enabled: false

service:
  type: ClusterIP
  port: 9101

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi

# The gRPC health service: SERVING once the listener is up and the relay
# runs, NOT_SERVING while the server drains.
probes:
  startup:
    periodSeconds: 2
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Shutdown: Fx stops the server with grpc.shutdown_timeout from the
# configuration; the grace period must exceed it.
terminationGracePeriodSeconds: 30
# Seconds the Pod keeps serving after termination starts, before the process is
# told to stop: Service endpoints and kube-proxy rules converge meanwhile, so no
# new connection reaches a closed listener during a rolling restart. Counts
# against terminationGracePeriodSeconds; 0 disables it.
shutdownDelaySeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Telemetry placement (P23): the collector's OTLP endpoint for spans
# (ANVILKIT_CONTROL_TELEMETRY_OTLP_ENDPOINT) and the port of its own metrics listener
# (ANVILKIT_CONTROL_TELEMETRY_METRICS_LISTEN, never the service port); empty disables it.
# Scraping is the environment's pod annotations.
telemetry:
  otlpEndpoint: ""
  metricsPort: 0
  # The collector transport while otlpEndpoint is set: tls verifies the
  # collector against caSecret (key ca.crt) and serverName, mtls also presents
  # the workload certificate, development is plaintext (development.enabled).
  otlpTls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt
